<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALLMAN — Jeu de management esport FPS</title>

<meta property="og:type" content="website"><meta property="og:title" content="CALLMAN">
<meta property="og:description" content="Jeu de management esport FPS : dirige une franchise ou deviens le joueur que toute la ligue redoute."><meta property="og:url" content="https://chalmanag.github.io/V2CHAL/">

<link rel="canonical" href="https://chalmanag.github.io/V2CHAL/">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#07090c;--bg2:#0c1016;--panel:#111821;--panel2:#171f2b;--line:#222d3b;--txt:#e7edf4;--mut:#8896a8;--acc:#b8ff2c;--acc2:#ff7a1a;--good:#34d399;--bad:#f43f5e;--warn:#fbbf24;--team:#b8ff2c;--r:6px}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--txt);font:600 15px/1.45 'Rajdhani','Segoe UI',system-ui,sans-serif;font-variant-numeric:tabular-nums;
background-image:radial-gradient(900px 420px at 85% -5%,color-mix(in srgb,var(--team) 14%,transparent),transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 14px);background-attachment:fixed}
h1,h2,h3,h4{font-family:'Oxanium','Rajdhani',sans-serif;margin:0;letter-spacing:.02em}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}
aside{background:linear-gradient(180deg,#0a0e13,#080b0f);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-family:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:20px;letter-spacing:.08em;padding:4px 10px 14px}
.logo b{color:var(--acc)}
.logo small{display:block;font:600 10px 'Rajdhani','Segoe UI',system-ui,sans-serif;letter-spacing:.3em;color:var(--mut);margin-top:-2px}
nav button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;border-left:3px solid transparent;padding:9px 12px;margin:1px 0;color:var(--mut);cursor:pointer;text-align:left;font-size:15px;letter-spacing:.03em;border-radius:0 6px 6px 0}
nav button:hover{background:#121a24;color:var(--txt)}
nav button.on{background:linear-gradient(90deg,color-mix(in srgb,var(--team) 16%,transparent),transparent);border-left-color:var(--team);color:#fff}
nav .ic{width:18px;text-align:center;opacity:.9}
nav .badge{margin-left:auto;background:var(--acc2);color:#000;border-radius:9px;padding:0 7px;font-size:12px;font-weight:700}
nav .sep{height:1px;background:var(--line);margin:10px 8px}
main{padding:16px 22px 60px;min-width:0}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--team);border-radius:var(--r)}
.top .who{display:flex;gap:10px;align-items:center}
.top .stat{display:flex;flex-direction:column;line-height:1.15}
.top .stat small{color:var(--mut);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.top .stat b{font-size:17px}
.top .sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:5px;cursor:pointer;font-weight:700;letter-spacing:.04em;transition:.12s}
.btn:hover{border-color:var(--mut);background:#1c2635}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0a1200;box-shadow:0 0 18px -4px var(--acc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{background:var(--acc2);border-color:var(--acc2);color:#160800}
.btn.dan{border-color:#6b1d2b;color:#ff8da1}
.btn.sm{padding:3px 9px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card>h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card>h3::before{content:"";width:8px;height:8px;background:var(--team);transform:skew(-20deg)}
.card>h3 .r{margin-left:auto;letter-spacing:.05em;text-transform:none}
.h1{font-size:26px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:12px}
.h1 small{font:600 14px 'Rajdhani','Segoe UI',system-ui,sans-serif;color:var(--mut);letter-spacing:.06em}
.mut{color:var(--mut)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.acc{color:var(--acc)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #161e29;white-space:nowrap}
tr.clk{cursor:pointer}tr.clk:hover td{background:#16202c}
tr.me td{background:color-mix(in srgb,var(--team) 10%,transparent)}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tw{overflow-x:auto}
.c{text-align:center}.rt{text-align:right}
.ovr{display:inline-block;min-width:34px;text-align:center;font:800 14px 'Oxanium','Rajdhani','Segoe UI',sans-serif;padding:1px 6px;border-radius:4px;color:#06090c}
.o-s{background:linear-gradient(135deg,#ffe066,#ffb300)}.o-a{background:#34d399}.o-b{background:#a3e635}.o-c{background:#fb923c}.o-d{background:#64748b;color:#e2e8f0}
.chip{display:inline-block;padding:0 7px;border-radius:3px;font-size:12px;font-weight:700;letter-spacing:.06em;border:1px solid var(--line);background:#0c1219}
.r-SMG{color:#ff9a5a;border-color:#5a3318}.r-AR{color:#6cc4ff;border-color:#1c4663}.r-FLEX{color:#d9a8ff;border-color:#4a2a63}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:0 6px;height:22px;border-radius:3px;background:color-mix(in srgb,var(--c) 22%,#0b0f14);border:1px solid var(--c);color:#fff;font:800 12px 'Oxanium','Rajdhani','Segoe UI',sans-serif;letter-spacing:.05em}
.bdg.lg{height:42px;min-width:62px;font-size:18px}
.bar{height:6px;background:#0a0e13;border-radius:3px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:3px}
.starter{color:var(--acc);font-size:11px;margin-right:4px}
.form{display:inline-flex;gap:3px}.form i{width:18px;height:18px;border-radius:3px;font:700 11px/18px 'Oxanium','Rajdhani',sans-serif;text-align:center;font-style:normal;color:#000}
.form .W{background:var(--good)}.form .L{background:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.kv span:nth-child(odd){color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:5px;cursor:pointer;color:var(--mut);font-weight:700}
.tabs button.on{color:#000;background:var(--team);border-color:var(--team)}
.flt{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.flt input,.flt select,select.sel,input.inp{background:#0a0f15;border:1px solid var(--line);border-radius:5px;padding:6px 9px;min-width:0}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#131c28,#0d131b 60%);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.hero::before,.hero::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--team)}
.hero::before{left:6px;top:6px;border-right:0;border-bottom:0}.hero::after{right:6px;bottom:6px;border-left:0;border-top:0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;text-align:center}
.vs .tn{font:800 22px 'Oxanium','Rajdhani',sans-serif}.vs .big{font:800 34px 'Oxanium','Rajdhani',sans-serif;color:var(--mut)}
.cmp{display:grid;grid-template-columns:50px 1fr 50px;gap:8px;align-items:center;margin:4px 0;font-size:14px}
.cmp .b2{display:flex;height:8px;background:#0a0e13;border-radius:4px;overflow:hidden}
.cmp .b2 i{display:block;height:100%}
.news li,.ledger li{padding:5px 0;border-bottom:1px solid #161e29;list-style:none}
ul.news,ul.ledger{margin:0;padding:0}
.mb{position:fixed;inset:0;background:rgba(2,4,7,.78);backdrop-filter:blur(3px);display:none;overflow:auto;padding:24px 12px;z-index:60}
.mb.on{display:block}
.md{max-width:940px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--team);border-radius:var(--r);padding:18px 20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.md.sm{max-width:560px}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mh h2{font-size:24px}.mh .x{margin-left:auto}
.toast{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast div{background:#10161e;border:1px solid var(--line);border-left:4px solid var(--acc);padding:9px 14px;border-radius:5px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:ti .25s}
.toast div.e{border-left-color:var(--bad)}
@keyframes ti{from{transform:translateX(30px);opacity:0}}
.log{max-height:260px;overflow:auto;background:#0a0e14;border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:14px}
.log div{padding:2px 0;border-bottom:1px dashed #141c27}
.log b{color:var(--acc)}
.scoreb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;padding:10px;background:#0a0e14;border:1px solid var(--line);border-radius:6px}
.scoreb .n{font:800 20px 'Oxanium','Rajdhani',sans-serif}.scoreb .s{font:800 40px 'Oxanium','Rajdhani',sans-serif;letter-spacing:.05em}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;background:#0c1219;border:1px solid var(--line);font-size:13px}
.msg{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:var(--panel)}
.msg>div:first-child{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.msg .dot{width:8px;height:8px;border-radius:50%;background:var(--acc2)}
.msg .body{padding:0 14px 12px;color:#c4cfdb}
.msg.read .dot{background:transparent}
.menu{max-width:1100px;margin:0 auto;padding:30px 18px 60px}
.menu h1{font-size:56px;font-weight:800;letter-spacing:.06em;line-height:1}
.menu h1 b{color:var(--acc)}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:.12s}
.tcard:hover{border-color:var(--c)}.tcard.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel));box-shadow:0 0 0 1px var(--c)}
.pip{display:inline-block;width:14px;height:8px;margin-right:3px;background:#1d2733;transform:skew(-20deg)}.pip.on{background:var(--acc)}
.brk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bm{background:#0a0e14;border:1px solid var(--line);border-radius:5px;margin-bottom:10px;overflow:hidden}
.bm div{display:flex;justify-content:space-between;padding:5px 10px;gap:10px}
.bm div+div{border-top:1px solid #141c27}.bm .w{background:color-mix(in srgb,var(--acc) 10%,transparent);font-weight:700}
details.day{border:1px solid var(--line);border-radius:5px;margin-bottom:6px;background:var(--panel)}
details.day summary{padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
details.day .in{padding:4px 12px 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spark{width:100%;height:70px}
/* ---- v4 : suivi simple, créateur, flowchart, monétisation ---- */
.scoreb .s.sm{font-size:24px;color:var(--acc)}
.pill.on{border-color:var(--acc);color:var(--acc)}
.fgrp{border:1px solid var(--line);border-radius:8px;padding:6px 14px 10px;margin:10px 0;background:#0d131b}
.fgrp>b{display:block;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--acc);margin-top:6px}
.endcard{margin-top:10px;padding:10px 12px;border:1px solid var(--team);border-radius:6px;background:color-mix(in srgb,var(--team) 10%,transparent)}
.flowwrap{overflow-x:auto;padding-bottom:6px}.flow{position:relative}.flow svg{position:absolute;left:0;top:0}
.fn{position:absolute;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:#0d131b;font-size:13px;overflow:hidden;line-height:1.15}
.fn span{font-size:16px}.fn b{font-weight:600}
.fn.v{border-color:var(--team);background:color-mix(in srgb,var(--team) 16%,#0d131b);box-shadow:0 0 0 1px var(--team)}
.fn.c{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2);animation:blink 1.6s infinite}
.fn.f{border-style:dashed;color:var(--mut)}.fn.u{opacity:.4;color:var(--mut)}.fn.end{border-radius:20px}
.adwrap{max-width:970px;margin:16px auto;min-height:60px;text-align:center}
.adwrap.demo{border:1px dashed var(--line);color:var(--mut);padding:18px;border-radius:6px}
.cbanner{position:fixed;left:12px;right:12px;bottom:12px;z-index:90;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#0f1620;border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:8px;padding:12px 16px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.cbanner a{color:var(--acc)}
.adov{position:fixed;inset:0;z-index:99;background:rgba(2,4,7,.9);display:flex;align-items:center;justify-content:center}
.flinks{margin-top:6px}.flinks a{color:#98a6b8}

/* ---- accueil CSS pur ---- */
.hbg{position:absolute;inset:0;z-index:-3;overflow:hidden;background:radial-gradient(900px 500px at 78% 40%,rgba(184,255,44,.10),transparent 70%),radial-gradient(800px 500px at 15% 80%,rgba(255,122,26,.09),transparent 70%),#05070a}
.hgrid{position:absolute;left:-10%;right:-10%;bottom:-20%;height:75%;background-image:linear-gradient(rgba(184,255,44,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(184,255,44,.16) 1px,transparent 1px);background-size:64px 64px;transform:perspective(500px) rotateX(62deg);transform-origin:50% 100%;animation:grid 3.2s linear infinite;mask-image:linear-gradient(to top,#000 20%,transparent 85%)}
@keyframes grid{to{background-position:0 64px}}
.radar{position:absolute;right:-12vmin;top:50%;width:86vmin;height:86vmin;margin-top:-43vmin;border-radius:50%;border:1px solid rgba(184,255,44,.25);background:repeating-radial-gradient(circle,transparent 0 14%,rgba(184,255,44,.14) 14% 14.4%),linear-gradient(rgba(184,255,44,.12),rgba(184,255,44,.12)) 50% 0/1px 100% no-repeat,linear-gradient(rgba(184,255,44,.12),rgba(184,255,44,.12)) 0 50%/100% 1px no-repeat;opacity:.9}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(184,255,44,.38),rgba(184,255,44,0) 60deg,rgba(184,255,44,0));animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{position:absolute;width:10px;height:10px;border-radius:50%;background:#ff7a1a;box-shadow:0 0 14px 4px rgba(255,122,26,.6);animation:blip 6s ease-out infinite}
@keyframes blip{0%{transform:scale(.2);opacity:0}10%{transform:scale(1.3);opacity:1}60%{opacity:.4}100%{transform:scale(1);opacity:0}}
.streaks i{position:absolute;left:-30%;height:2px;width:30%;background:linear-gradient(90deg,transparent,rgba(255,243,196,.85),transparent);opacity:0;animation:streak 5s linear infinite}
.streaks i:nth-child(1){top:18%;animation-delay:0s}.streaks i:nth-child(2){top:32%;animation-delay:1.1s;animation-duration:4s}.streaks i:nth-child(3){top:47%;animation-delay:2.2s}.streaks i:nth-child(4){top:61%;animation-delay:.6s;animation-duration:6s}.streaks i:nth-child(5){top:74%;animation-delay:3s}.streaks i:nth-child(6){top:86%;animation-delay:1.8s;animation-duration:4.5s}
@keyframes streak{0%{transform:translateX(0);opacity:0}8%{opacity:1}60%{opacity:.9}100%{transform:translateX(480%);opacity:0}}

/* ---- accueil ---- */
.solo{display:block}
.home{position:relative;min-height:100vh;overflow:hidden;background:#05070a;isolation:isolate;display:flex;flex-direction:column}
.hhero{flex:1;display:flex;flex-direction:column;justify-content:center}
.hshade{position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 42%,rgba(5,7,10,.5),rgba(5,7,10,.82) 78%),linear-gradient(180deg,rgba(5,7,10,.7),transparent 26%,transparent 72%,rgba(5,7,10,.9))}
.scan{position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;animation:scan 9s linear infinite}
@keyframes scan{to{background-position:0 60px}}
.hdots{position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(184,255,44,.55) 1px,transparent 1.5px),radial-gradient(rgba(255,122,26,.45) 1px,transparent 1.5px);background-size:140px 140px,210px 210px;background-position:0 0,60px 90px;opacity:.28;animation:hdots 24s linear infinite}
@keyframes hdots{to{background-position:0 -280px,60px -330px}}
.hnav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px clamp(16px,4vw,44px)}
.hlogo{font:800 20px 'Oxanium','Rajdhani',sans-serif;letter-spacing:.1em}.hlogo b{color:var(--acc)}
.nonoff{border-color:#7a4a14;color:#ffb35c;background:rgba(255,122,26,.08);letter-spacing:.08em;font-weight:700}
.hhero{max-width:1180px;margin:0 auto;padding:clamp(10px,3vh,40px) clamp(16px,4vw,44px) 8px;text-align:center}
.eyebrow{letter-spacing:.42em;font-size:12px;color:var(--mut);animation:hin .9s ease both}
.glitch{font:800 clamp(44px,9vw,112px)/1 'Oxanium','Rajdhani',sans-serif;letter-spacing:.06em;margin:10px 0 6px;position:relative;display:inline-block;text-shadow:0 0 40px rgba(184,255,44,.25);animation:hin 1s .1s ease both}
.glitch b{color:var(--acc)}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none;overflow:hidden}
.glitch::before{color:#ff3b6b;transform:translate(3px,0);clip-path:inset(0 0 62% 0);animation:gl1 4.2s infinite steps(1);opacity:0}
.glitch::after{color:#33e1ff;transform:translate(-3px,0);clip-path:inset(60% 0 0 0);animation:gl2 3.6s infinite steps(1);opacity:0}
@keyframes gl1{0%,88%,100%{transform:translate(0,0);opacity:0}90%{transform:translate(4px,-2px);opacity:.8;clip-path:inset(10% 0 55% 0)}94%{transform:translate(-3px,1px);opacity:.8;clip-path:inset(40% 0 30% 0)}}
@keyframes gl2{0%,82%,100%{transform:translate(0,0);opacity:0}84%{transform:translate(-4px,2px);opacity:.8;clip-path:inset(55% 0 10% 0)}91%{transform:translate(3px,-1px);opacity:.8;clip-path:inset(25% 0 50% 0)}}
.hsub{max-width:660px;margin:0 auto 22px;font-size:19px;color:#b6c2d1;animation:hin 1s .25s ease both}
@keyframes hin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;text-align:left;animation:hin 1s .4s ease both}
.mcard{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;padding:22px 24px;background:linear-gradient(150deg,rgba(18,26,37,.76),rgba(10,14,20,.82));backdrop-filter:blur(4px);cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.mcard:hover{transform:translateY(-6px);box-shadow:0 22px 50px -18px rgba(0,0,0,.8)}
.m1:hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 22px 50px -14px rgba(184,255,44,.35)}.m2:hover{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2),0 22px 50px -14px rgba(255,122,26,.4)}
.mglow{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(184,255,44,.3),transparent 65%);animation:pulse 4s ease-in-out infinite}.mglow.o{background:radial-gradient(circle,rgba(255,122,26,.34),transparent 65%)}
@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}

<script>
'use strict';
/* CALLMAN — jeu indépendant (noms fictifs) */

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const rnd=Math.random;
const ri=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtK=v=>(v<0?'-':'')+'$'+(Math.abs(v)>=1000?(Math.abs(v)/1000).toFixed(2)+'M':Math.round(Math.abs(v))+'k');
const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- DONNÉES ---------- */
const EDITION='public'; // 'fan' = usage privé · 'public' = version fictive publiable (voir build_public.py)
const TEAM_PUBLIC=[
 {id:'OBW',name:'Obsidian Wolves',color:'#8b5cf6',rep:86},
 {id:'NVP',name:'Neon Vipers',color:'#22c55e',rep:82},
 {id:'ASH',name:'Ashen Foxes',color:'#f97316',rep:78},
 {id:'STG',name:'Static Ghosts',color:'#38bdf8',rep:75},
 {id:'IRM',name:'Iron Meridian',color:'#94a3b8',rep:72},
 {id:'SDR',name:'Solar Drift',color:'#facc15',rep:70},
 {id:'HLC',name:'Hollow Crown',color:'#ec4899',rep:68},
 {id:'GLU',name:'Glacier Unit',color:'#67e8f9',rep:66},
 {id:'RST',name:'Rustline',color:'#ef4444',rep:64},
 {id:'ECD',name:'Echo Division',color:'#a3e635',rep:62},
 {id:'COB',name:'Cobalt Syndicate',color:'#3b82f6',rep:60},
 {id:'WLC',name:'Wild Circuit',color:'#14b8a6',rep:58}];

const TEAM_SETS=EDITION==='public'?{public:TEAM_PUBLIC}:{...TEAM_FAN,public:TEAM_PUBLIC};
let NAMESET=EDITION==='public'?'public':'real';
if(EDITION!=='public'){try{NAMESET=localStorage.getItem('cc_ns')||'real'}catch(e){}}
if(!TEAM_SETS[NAMESET])NAMESET=EDITION==='public'?'public':'real';
const teamDefs=()=>TEAM_SETS[NAMESET];
const TAGS=['Kairo','Vandal','Mirage','Tempo','Slate','Quill','Rave','Onyx','Falk','Brisk','Jinx','Cobra','Echo','Nyx','Pixel','Strix','Wraith','Zephyr','Ricochet','Flux','Gator','Halcyon','Ion','Jolt','Kestrel','Lynx','Mako','Nimbus','Orbit','Pyro','Quasar','Rift','Sable','Talon','Umbra','Viper','Warden','Xeno','Yeti','Zulu','Blitz','Cinder','Drift','Ember','Fang','Glitch','Hex','Ivory','Juno','Krypt','Lotus','Mantis','Nomad','Opal','Prism','Rogue','Spectre','Thorn','Ultima','Vortex','Whisper','Axiom','Bolt','Cipher','Dagger','Eclipse','Fable','Gale','Havoc','Iris','Jackal','Karma','Lumen','Mosaic','Nectar','Obsidian','Patch','Quartz','Raptor','Sirius','Tundra','Unity','Venom','Wisp','Yonder','Zenith','Atlas','Bravo','Cosmo','Dusk','Elixir','Frost','Ghost','Hydra','Ignis','Jester','Knox','Lazer','Mirth','Nova','Oxide','Pulse','Quake','Rune','Sonic','Tyrant','Umber','Vector','Wolfe','Xylo','Yara','Zero','Arctic','Bandit','Comet','Delta','Enigma','Fury','Grim','Hunter','Indigo','Jade','Kilo','Lunar','Maverick','Nitro','Omen','Phoenix','Rebel','Saber','Titan','Valor'];
const NATS=['US','US','US','US','US','CA','CA','GB','GB','FR','FR','DE','AU','BR','SE','ES','NL','MX','KR'];
const FLAG={US:'🇺🇸',CA:'🇨🇦',GB:'🇬🇧',FR:'🇫🇷',DE:'🇩🇪',AU:'🇦🇺',BR:'🇧🇷',SE:'🇸🇪',ES:'🇪🇸',NL:'🇳🇱',MX:'🇲🇽',KR:'🇰🇷'};
/* ---------- ÉDITION (fan / publique) ---------- */
const ED_PUBLIC={public:true,title:'CALLMAN',logoHTML:'CALL<b>MAN</b>',logoText:'CALLMAN',pts:'Points de ligue',titres:'Titres de ligue',champion:'Champion de la ligue',
 modes:{hp:'Zone',snd:'Bombe',ovl:'Relais'},modesS:{hp:'ZONE',snd:'BOMBE',ovl:'RELAIS'},
 eyebrow:'SIMULATION & CARRIÈRE · FPS ESPORT',nonoff:'JEU INDÉPENDANT · NOMS FICTIFS',
 foot:'Jeu indépendant. Tous les noms d\'équipes et de joueurs sont fictifs ; toute ressemblance avec des personnes ou des organisations existantes serait fortuite.',
 menuTag:'CARRIÈRE MANAGER',sysNote:'Jeu indépendant : équipes et joueurs fictifs.',
 ticker:['🔥 Un rookie de 17 ans claque 41 kills en une seule carte','📈 Les audiences du Championnat battent tous les records','🏆 Une franchise surprise remporte son premier Major','💸 Le marché des agents libres s\'emballe avant l\'intersaison','🎯 « Le gunskill ne fait pas tout » — le coach d\'un favori après une défaite 0-3','🧠 Les analystes vidéo deviennent les recrues les plus convoitées','⚡ Le mode Relais : la nouvelle méta divise les équipes','🎙️ Un streamer reconverti signe son premier contrat pro']};

const ED=EDITION==='public'?ED_PUBLIC:ED_FAN;
const MODE=ED.modes;
const MODE_S=ED.modesS;
const MODE_ORDER=['hp','snd','ovl','hp','snd'];
const ATTRS=['aim','iq','team','clutch','speed','cons'];
const ATTR_L={aim:'Gunskill',iq:'Game IQ',team:'Teamplay',clutch:'Clutch',speed:'Mobilité',cons:'Régularité'};
const TACT={agr:'Agressif',bal:'Équilibré',cau:'Contrôle'};
const RD={QF:'Quarts',SF:'Demi-finales',F:'Finale'};
const ROLEB={SMG:{hp:2,snd:-1,ovl:1.5},AR:{hp:-.5,snd:2,ovl:.5},FLEX:{hp:.5,snd:.5,ovl:1}};
const CAP=2000, DAYS=59, MAXROSTER=6;
const STAFF_L={coach:'Coach principal',analyst:'Analyste',psy:'Psychologue / Performance',scout:'Recruteur / Scout'};
const STAFF_D={coach:'Accélère la progression de tous les joueurs.',analyst:'Bonus de force d\'équipe à chaque carte.',psy:'Meilleur moral et récupération de la fatigue.',scout:'Révèle plus précisément le potentiel des joueurs.'};
const STAFF_COST=[0,0,0,250,450,700];
const PRIZE_MAJOR={1:400,2:250,3:150,5:60}, PRIZE_CHAMPS={1:1500,2:800,3:450,5:200}, PTS_MAJOR={1:25,2:18,3:12,5:6};

/* ---------- état ---------- */
let G=null;
const ui={fn:null,timer:null,screen:'home'};
const T=id=>G.teams[id], P=id=>G.players[id], me=()=>G.teams[G.me];
const roster=tid=>{const r=[];for(const id in G.players){const p=G.players[id];if(p.team===tid)r.push(p)}return r};
const freeAgents=()=>Object.values(G.players).filter(p=>p.team===null);
const payroll=tid=>roster(tid).reduce((s,p)=>s+p.wage,0);
const yearsLeft=p=>p.contractEnd-G.season+(G.phase==='season'?1:0);

/* ---------- joueurs ---------- */
function modeBase(p,m){const a=p.attrs;let v;
 if(m==='hp')v=a.aim*.28+a.speed*.26+a.team*.24+a.cons*.12+a.iq*.10;
 else if(m==='snd')v=a.iq*.30+a.clutch*.26+a.aim*.24+a.cons*.12+a.team*.08;
 else v=a.team*.28+a.speed*.20+a.iq*.20+a.aim*.20+a.clutch*.12;
 return v+ROLEB[p.role][m]}
const ovr=p=>Math.round(modeBase(p,'hp')*.38+modeBase(p,'snd')*.32+modeBase(p,'ovl')*.30);
const condF=p=>1+(p.morale-60)/60*.035+(p.form-50)/50*.03-Math.max(0,p.fatigue-40)/60*.07;
const effMode=(p,m)=>modeBase(p,m)*condF(p);
const effOvr=p=>ovr(p)*condF(p);
const salaryFor=o=>40+Math.pow(Math.max(0,o-50),1.75);
const worth=p=>{const o=ovr(p);return o+(p.age<=22?.35*(p.pot-o):0)};
const valueP=p=>Math.round(salaryFor(worth(p))*(p.age<=21?2.4:p.age<=24?1.9:p.age<=27?1.4:.8));
const askWage=(p,t)=>Math.round(salaryFor(worth(p))*(1.18-.003*(t?t.rep:60)));
function uniqueTag(){const used=new Set(Object.values(G.players).map(p=>p.tag));let c=0,t;do{t=pick(TAGS);if(c>25)t=t+pick(['x','_','7','99','Q','II']);c++}while(used.has(t));return t}
function genPlayer(target,age,role){
 const id='p'+(G.nextPid++),sk=()=>ri(-7,7),o=age>26?(age-26)*1.2:0;
 const a={aim:target+sk()+(role==='SMG'?3:0),iq:target+sk()+(role==='AR'?4:0),team:target+sk()+(role==='FLEX'?3:0),clutch:target+sk()+(role==='AR'?2:0),speed:target+sk()+(role==='SMG'?3:0)-o,cons:target+sk()};
 const p={id,tag:uniqueTag(),age,nat:pick(NATS),role,attrs:a,team:null,morale:65,form:50,fatigue:15,wage:0,contractEnd:0,pot:0,st:{m:0,k:0,d:0,rs:0,mvp:0},focus:null,listed:false,hist:[]};
 const diff=target-ovr(p);ATTRS.forEach(k=>a[k]=clamp(a[k]+diff,28,97));
 const cur=ovr(p);
 p.pot=Math.round(clamp(cur+(age<=19?ri(4,18):age<=21?ri(2,12):age<=24?ri(0,6):ri(0,2)),cur,96));
 G.players[id]=p;return p}
function potRange(p){
 if(p.team===G.me)return `${Math.max(ovr(p),p.pot-1)}–${p.pot+1}`;
 const w=Math.max(1,Math.round((6-me().staff.scout)*2.2)),h=hash(p.id);
 const c=Math.round(p.pot+((h%100)/100-.5)*w);
 return `${Math.max(ovr(p),c-w)}–${Math.min(99,c+w)}`}

/* ---------- création de la ligue ---------- */
function genLeague(){
 G={v:1,mode:'manager',me:null,mgr:'Manager',season:1,day:0,phase:'season',view:'dash',teams:{},players:{},cal:[],results:{},stageTbl:{},pts:{},rec:{},brk:{},inbox:[],news:[],ledger:[],balHist:[],hist:[],fin:{income:0,wages:0,prizes:0,transfers:0},nextPid:1,nextMid:1,board:{conf:60,obj:[]},sel:{mkt:{tab:'fa',role:'',q:'',minOvr:0,maxAge:40},stage:1,team:null,stats:{role:''}},msgId:1,fired:false};
 teamDefs().forEach(d=>{G.teams[d.id]={...d,short:d.id,balance:1000,staff:{coach:2,analyst:2,psy:1,scout:1},lineup:[],tactics:{hp:'bal',snd:'bal',ovl:'bal'},chem:ri(52,70),training:{focus:'bal',intensity:'normal'},form:[],titles:0,majors:0}});
 const roles=['SMG','AR','SMG','FLEX','AR','SMG'];
 for(const t of Object.values(G.teams)){
  const base=62+(t.rep-50)*.3;
  const sorted=[];
  shuffle(roles.slice()).forEach((r,i)=>{
   const target=Math.round(base+ri(-4,4)-(i>=4?6:0));
   const p=genPlayer(clamp(target,48,84),ri(18,29),r);
   p.team=t.id;p.wage=Math.round(salaryFor(worth(p))*(.9+rnd()*.2));p.contractEnd=1+ri(0,2);p.morale=ri(58,78);
  });
  autoLineup(t.id);
 }
 for(let i=0;i<28;i++){const p=genPlayer(ri(48,64),ri(19,30),pick(['SMG','AR','FLEX']));p.morale=60}
 for(let i=0;i<12;i++){const p=genPlayer(ri(42,56),ri(16,19),pick(['SMG','AR','FLEX']));p.pot=ri(66,90)}
 newSeasonSetup();
}
function newSeasonSetup(){
 G.cal=buildCal();G.day=0;G.results={};G.brk={};G.stageTbl={};G.pts={};G.rec={};
 for(let s=1;s<=4;s++){G.stageTbl[s]={};}
 for(const id in G.teams){for(let s=1;s<=4;s++)G.stageTbl[s][id]={w:0,l:0,mw:0,ml:0};G.pts[id]=0;G.rec[id]={w:0,l:0};G.teams[id].form=[]}
 G.fin={income:0,wages:0,prizes:0,transfers:0};G.balHist=[{d:0,b:G.me?me().balance:0}];
}
function buildCal(){
 const cal=[],ids=Object.keys(G.teams);
 for(let s=1;s<=4;s++){
  const rr=roundRobin(shuffle(ids.slice()));
  rr.forEach((ms,i)=>cal.push({k:'league',stage:s,n:i+1,label:`Stage ${s} · Journée ${i+1}`,matches:ms.map(([a,b])=>({id:'m'+(G.nextMid++),a,b}))}));
  ['QF','SF','F'].forEach(rd=>cal.push({k:'major',stage:s,rd,label:`Major ${s} · ${RD[rd]}`,matches:[]}));
 }
 ['QF','SF','F'].forEach(rd=>cal.push({k:'champs',rd,label:`Championnat · ${RD[rd]}`,matches:[]}));
 return cal}
function roundRobin(ids){const n=ids.length,arr=ids.slice(),rounds=[];
 for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];m.push(r%2?[b,a]:[a,b])}rounds.push(m);arr.splice(1,0,arr.pop())}
 return rounds}

/* ---------- effectifs ---------- */
function autoLineup(tid){
 const sc=p=>{let v=effOvr(p);if(G.mode==='player'&&G.car&&p.id===G.pid){v+=(G.car.trust-50)*.08;if(G.car.out>0)v-=999}return v};
 const r=roster(tid).sort((a,b)=>sc(b)-sc(a));
 if(G.mode==='player'&&G.car&&tid===G.me&&!(G.car.out>0)){const i=r.findIndex(p=>p.id===G.pid);if(i===4&&rnd()<.3)[r[3],r[4]]=[r[4],r[3]];else if(i===5&&rnd()<.1)[r[3],r[5]]=[r[5],r[3]]}
 T(tid).lineup=r.slice(0,4).map(p=>p.id)}
function lineupPlayers(tid){const t=T(tid);let ps=t.lineup.map(P).filter(p=>p&&p.team===tid);if(ps.length<4||new Set(t.lineup).size<4){autoLineup(tid);ps=t.lineup.map(P)}return ps}
const teamOvr=tid=>avg(roster(tid).map(ovr).sort((a,b)=>b-a).slice(0,4));
const expRank=tid=>Object.keys(G.teams).sort((a,b)=>teamOvr(b)-teamOvr(a)).indexOf(tid)+1;
function roleBalance(ps){const c={SMG:0,AR:0,FLEX:0};ps.forEach(p=>c[p.role]++);let b=0;if(c.SMG>=1&&c.AR>=1)b+=1;if(c.FLEX>=1)b+=.5;if(Math.max(c.SMG,c.AR,c.FLEX)>=4)b-=3;else if(c.AR===0||c.SMG===0)b-=1.5;return b}
function styleScore(ps){return avg(ps.map(p=>(p.attrs.aim+p.attrs.speed)/2-(p.attrs.iq+p.attrs.team)/2))}
function teamStrength(tid,mode,tactic){
 const t=T(tid),ps=lineupPlayers(tid);
 const mean=avg(ps.map(p=>effMode(p,mode)));
 const st=styleScore(ps);let tb,v;
 if(tactic==='agr'){tb=clamp(st*.12,-2,2);v=1.3}else if(tactic==='cau'){tb=clamp(-st*.12,-2,2);v=.75}else{tb=.4;v=1}
 return{S:mean+(t.chem-50)/50*3.5+t.staff.analyst*.35+roleBalance(ps)+tb,v}}
const mapProb=(A,B)=>1/(1+1/Math.exp((A.S-B.S)/(10*(A.v+B.v)/2)));

/* ---------- simulation d'un match ---------- */
function pickW(arr,fn){const w=arr.map(p=>Math.pow(Math.max(1,fn(p)),2)),s=w.reduce((a,b)=>a+b,0);let r=rnd()*s;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i]}return arr[arr.length-1]}
/* ---------- noms de cartes (simple habillage) ---------- */
const MAP_NAMES=['Villa Solano','Aurora Rooftops','Stade Rojo','Nova Station','Bunker 47','Auto Mile'];
/* ---------- simulation d'une carte ---------- */
function pickBy(arr,fn){const w=arr.map(fn),s=w.reduce((a,b)=>a+b,0);let r=rnd()*s;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i]}return arr[arr.length-1]}
function simMap(mode,a,b,pA,mapName){
 const PA=lineupPlayers(a),PB=lineupPlayers(b),sh=t=>T(t).short,pr=.5+(pA-.5)*.45;
 const wk={},wd={};[...PA,...PB].forEach(p=>{const e=effMode(p,mode);wk[p.id]=Math.pow(e,3)*(.75+rnd()*.5);wd[p.id]=Math.pow(115-e,2)*(.75+rnd()*.5)});
 if(G.mode==='player'&&G.car&&wk[G.pid]){const c=G.car,m={safe:[.9,.72],std:[1,1],risk:[1.28,1.3]}[c.mind||'std'];let a2=m[0],d2=m[1];
  if(c.traits.includes('clutch')&&mode==='snd')a2*=1.08;if(c.traits.includes('entry')&&mode!=='snd'){a2*=1.08;d2*=1.06}if(c.traits.includes('brain')&&mode==='snd')a2*=1.05;
  if(c.health<50){const h=1+(50-c.health)/50*.15;a2/=h;d2*=h}if(c.stress>70){d2*=1.08;a2*=.95}wk[G.pid]*=a2;wd[G.pid]*=d2}
 const stats={};[...PA,...PB].forEach(p=>stats[p.id]={k:0,d:0});
 const me_=G.mode==='player'&&G.pid&&stats[G.pid]?G.pid:null;
 let scK=0,scD=0;
 const dmg=(kp,vp,n,distinct)=>{const pool=vp.slice();for(let i=0;i<n;i++){const k=pickBy(kp,p=>wk[p.id]);const src=distinct&&pool.length?pool:vp;const v=pickBy(src,p=>wd[p.id]);if(distinct){const ix=pool.indexOf(v);if(ix>=0)pool.splice(ix,1)}stats[k.id].k++;stats[v.id].d++;if(k.id===me_)scK++;if(v.id===me_)scD++}};
 const tail=()=>{const t=me_&&(scK||scD)?` · ★ ${P(me_).tag} ${scK}K/${scD}D`:'';scK=scD=0;return t};
 const star=()=>null;
 let sa=0,sb=0,r=0;const log=[];
 if(mode==='hp'){
  while(sa<250&&sb<250){r++;const aw=rnd()<pr,w=ri(19,34),l=ri(5,17);if(aw){sa+=w;sb+=l}else{sb+=w;sa+=l}
   const hi=(r-1)%5,Wp=aw?PA:PB,Lp=aw?PB:PA;dmg(Wp,Lp,ri(8,13));dmg(Lp,Wp,ri(5,9));
   log.push({text:`Rotation ${r} — <b>${sh(aw?a:b)}</b> contrôle la zone ${hi+1}${tail()}`,sa:Math.min(sa,250),sb:Math.min(sb,250)})}
  if(sa>=250){sa=250;sb=Math.min(sb,249)}else{sb=250;sa=Math.min(sa,249)}
 }else if(mode==='snd'){
  while(sa<6&&sb<6){r++;const aw=rnd()<pr;aw?sa++:sb++;
   const atk=(r<=3||(r>=7&&r<=9))?'a':'b',W=aw?'a':'b',site=rnd()<.5?'A':'B',At=atk==='a'?PA:PB,Df=atk==='a'?PB:PA;
   let ak,dk,typ;
   if(W===atk){if(rnd()<.45){typ='elim';ak=4;dk=pick([0,0,1,1,2,3])}else{typ='bomb';ak=ri(1,3);dk=ri(0,2)}}
   else{const q=rnd();if(q<.5){typ='elim';dk=4;ak=pick([0,0,1,1,2,3])}else if(q<.82){typ='defuse';ak=ri(1,2);dk=ri(0,3)}else{typ='time';ak=ri(0,2);dk=ri(1,3)}}
   dmg(At,Df,ak,true);dmg(Df,At,dk,true);
   const msg={elim:'élimination complète',bomb:`pose sur ${site} et explosion`,defuse:`défuse sur ${site}`,time:'le temps expire'}[typ];
   log.push({text:`Manche ${r} — <b>${sh(aw?a:b)}</b> · ${msg}${tail()}`,sa,sb})}
 }else{
  while(sa<5&&sb<5){r++;const aw=rnd()<pr;aw?sa++:sb++;const Wp=aw?PA:PB,Lp=aw?PB:PA;
   dmg(Wp,Lp,ri(8,13));dmg(Lp,Wp,ri(5,9));
   log.push({text:`Relais ${r} — <b>${sh(aw?a:b)}</b> marque${tail()}`,sa,sb})}
 }
 if(log.length){log[log.length-1].sa=sa;log[log.length-1].sb=sb}
 const avgK={hp:25,snd:5.3,ovl:18}[mode];
 for(const id in stats){const s=stats[id];s.r=+clamp(.35+.45*(s.k/avgK)+.25*(s.k/Math.max(1,s.d)),.4,2.3).toFixed(2)}
 return{mode,map:mapName,sa,sb,stats,log}}
function simMatch(m,tacA,tacB,opts){
 let wa=0,wb=0;const maps=[],names=shuffle(MAP_NAMES.slice());
 for(let i=0;i<5;i++){if(wa===3||wb===3)break;const mode=MODE_ORDER[i];
  const SA=teamStrength(m.a,mode,tacA[mode]),SB=teamStrength(m.b,mode,tacB[mode]);let p=mapProb(SA,SB);
  if(i===4&&opts&&opts.decider){p=clamp(p+opts.decider*(opts.side==='a'?1:-1),.04,.96)}
  const mp=simMap(mode,m.a,m.b,p,names[i]);maps.push(mp);mp.sa>mp.sb?wa++:wb++}
 const win=wa>wb?m.a:m.b,agg={};
 maps.forEach(mp=>{for(const id in mp.stats){(agg[id]=agg[id]||[]).push(mp.stats[id].r)}});
 let mvp=null,best=-1;
 for(const id in agg){const t=P(id).team,sc=avg(agg[id])+(t===win?.08:0);if(sc>best){best=sc;mvp=id}}
 return{id:m.id,a:m.a,b:m.b,sa:wa,sb:wb,maps,mvp}}

function aiTac(tid,opp){const o={};for(const m of['hp','snd','ovl']){const d=teamStrength(tid,m,'bal').S-teamStrength(opp,m,'bal').S;o[m]=d>3?'cau':d<-3?'agr':pick(['bal','bal','agr','cau'])}return o}

/* ---------- application d'un résultat ---------- */
function commit(day,m,res,isUser){
 G.results[m.id]=res;res.day=G.day;res.comp=day.label;
 const wA=res.sa>res.sb,W=wA?m.a:m.b,L=wA?m.b:m.a;
 if(day.k==='league'){const tb=G.stageTbl[day.stage];tb[m.a].mw+=res.sa;tb[m.a].ml+=res.sb;tb[m.b].mw+=res.sb;tb[m.b].ml+=res.sa;tb[W].w++;tb[L].l++;G.pts[W]+=1}
 G.rec[W].w++;G.rec[L].l++;
 [[W,'W'],[L,'L']].forEach(([t,r])=>{const f=T(t).form;f.push(r);if(f.length>5)f.shift()});
 if(day.k!=='league'){const key=day.k==='major'?'major'+day.stage:'champs';const b=G.brk[key]=G.brk[key]||{};b[L]=day.rd==='QF'?5:day.rd==='SF'?3:2;if(day.rd==='F')b[W]=1}
 const rate={};
 res.maps.forEach(mp=>{for(const id in mp.stats){const p=P(id),s=mp.stats[id];p.st.m++;p.st.k+=s.k;p.st.d+=s.d;p.st.rs+=s.r;(rate[id]=rate[id]||[]).push(s.r)}});
 P(res.mvp).st.mvp++;
 for(const id in rate){const p=P(id),r=avg(rate[id]),won=p.team===W;
  p.form=clamp(p.form*.65+.35*(50+(r-1)*70),5,95);p.fatigue=clamp(p.fatigue+6,0,100);
  p.morale=clamp(p.morale+(won?4:-3+T(p.team).staff.psy*.4),0,100)}
 if(!isUser&&day.rd!=='F')res.maps.forEach(mp=>{delete mp.log});
 if(G.mode==='player'&&G.car&&(m.a===G.me||m.b===G.me))careerAfterMatch(res);
 const wt=T(W),lt=T(L),sc=`${Math.max(res.sa,res.sb)}-${Math.min(res.sa,res.sb)}`;
 if(isUser)news(`${wA===(m.a===G.me)?'✅':'❌'} ${T(m.a).short} ${res.sa}–${res.sb} ${T(m.b).short} (${day.label})`);
 else if(day.rd==='F')news(`🏆 ${tname(W)} bat ${lt.short} ${sc} en finale (${day.label})`);
 else if(res.sa+res.sb===3&&Math.max(res.sa,res.sb)===3&&teamOvr(L)-teamOvr(W)>5)news(`⚡ Surprise : ${wt.short} balaie ${lt.short} 3–0`)}

/* ---------- déroulé du calendrier ---------- */
function prepareDay(day){
 if(day.matches.length||day.k==='league')return;
 let seeds;
 if(day.rd==='QF'){
  seeds=day.k==='major'?stageRank(day.stage).slice(0,8):ptsRank().slice(0,8);
  day.matches=[[0,7],[3,4],[1,6],[2,5]].map(([x,y])=>({id:'m'+(G.nextMid++),a:seeds[x],b:seeds[y]}));
 }else{
  const idx=G.cal.indexOf(day),prev=G.cal[idx-1],win=prev.matches.map(m=>{const r=G.results[m.id];return r.sa>r.sb?m.a:m.b});
  day.matches=[];for(let i=0;i<win.length;i+=2)day.matches.push({id:'m'+(G.nextMid++),a:win[i],b:win[i+1]});
 }}
const userMatch=day=>day.matches.find(m=>m.a===G.me||m.b===G.me);
function stageRank(s){const tb=G.stageTbl[s];return Object.keys(tb).sort((x,y)=>{const a=tb[x],b=tb[y];return b.w-a.w||(b.mw-b.ml)-(a.mw-a.ml)||b.mw-a.mw||(x<y?-1:1)})}
function ptsRank(){return Object.keys(G.teams).sort((x,y)=>(G.pts[y]-G.pts[x])||(G.rec[y].w-G.rec[x].w)||(x<y?-1:1))}
const curDay=()=>G.cal[Math.min(G.day,G.cal.length-1)];
function rosterOK(){if(G.mode==='player')return true;const n=roster(G.me).length;if(n<4){toast('Il vous faut au moins 4 joueurs sous contrat.',1);return false}return true}

function finishDay(quiet){
 const day=G.cal[G.day];prepareDay(day);
 for(const m of day.matches)if(!G.results[m.id])commit(day,m,simMatch(m,aiTac(m.a,m.b),aiTac(m.b,m.a)),false);
 dailyTick(day);afterDay(day);pruneLogs();
 G.day++;
 if(G.day>=G.cal.length)seasonEnd();
 save();if(!quiet){refreshUI();if(G.mode==='player')openEvent()}
}
function pruneLogs(){
 const withLog=Object.values(G.results).filter(r=>r.maps.some(m=>m.log)).sort((x,y)=>y.day-x.day);
 withLog.slice(7).forEach(r=>r.maps.forEach(m=>{delete m.log}))}
function afterDay(day){
 if(day.k==='league'&&day.n===11)stageEnd(day.stage);
 if(day.k==='major'&&day.rd==='F')majorEnd(day.stage);
}
function stageEnd(s){
 const rk=stageRank(s),pos=rk.indexOf(G.me)+1,ex=expRank(G.me);
 if(G.mode==='manager')G.board.conf=clamp(G.board.conf+clamp((ex-pos)*1.5,-6,6),0,100);
 news(`📊 Fin du Stage ${s} : ${tname(rk[0])} termine en tête.`);
 if(G.mode==='player')clog('📊',`Stage ${s} terminé : ton équipe finit ${pos}ᵉ.`);else msg(`Stage ${s} terminé`,`Vous terminez <b>${pos}ᵉ</b> sur 12 (attendu : ${ex}ᵉ). ${pos<=8?'Vous êtes qualifiés pour le Major !':'Vous manquez le Major.'} Confiance du board : ${Math.round(G.board.conf)}%.`);
}
function majorEnd(s){
 const b=G.brk['major'+s]||{};
 for(const tid in b){const pl=b[tid];G.pts[tid]+=PTS_MAJOR[pl]||0;const pz=PRIZE_MAJOR[pl]||0;T(tid).balance+=pz;if(tid===G.me&&pz){G.fin.prizes+=pz;ledger(`Prime Major ${s} (place ${pl===5?'5–8':pl===3?'3–4':pl})`,pz)}}
 const w=Object.keys(b).find(t=>b[t]===1);if(w){T(w).majors++;T(w).rep=Math.min(99,T(w).rep+1);news(`🏆 ${tname(w)} remporte le Major ${s} !`);
  if(w===G.me){G.board.conf=clamp(G.board.conf+10,0,100);msg(`Major ${s} : CHAMPIONS !`,'Votre équipe soulève le trophée du Major. Le board est aux anges.')}
  else if(b[G.me]){G.board.conf=clamp(G.board.conf+(b[G.me]<=3?4:1),0,100)}
  else if(expRank(G.me)<=6)G.board.conf=clamp(G.board.conf-3,0,100)}
}
function seasonEnd(){
 const b=G.brk.champs||{},champ=Object.keys(b).find(t=>b[t]===1);
 for(const tid in b){const pz=PRIZE_CHAMPS[b[tid]]||0;T(tid).balance+=pz;if(tid===G.me&&pz){G.fin.prizes+=pz;ledger('Prime du Championnat',pz)}}
 if(champ){T(champ).titles++;T(champ).rep=Math.min(99,T(champ).rep+3)}
 const rk=ptsRank();rk.forEach((t,i)=>{if(i>=9)T(t).rep=Math.max(35,T(t).rep-1)});
 const cand=Object.values(G.players).filter(p=>p.st.m>=15&&p.team).sort((x,y)=>y.st.rs/y.st.m-x.st.rs/x.st.m)[0];
 const majors=[1,2,3,4].map(s=>{const bb=G.brk['major'+s]||{};return Object.keys(bb).find(t=>bb[t]===1)});
 G.hist.push({season:G.season,champs:champ,majors,mvp:cand?{tag:cand.tag,team:cand.team,r:(cand.st.rs/cand.st.m).toFixed(2)}:null});
 // évaluation du board
 const pos=b[G.me],q=ptsRank().indexOf(G.me)+1,ex=expRank(G.me);let d=0,txt=[];
 G.board.obj.forEach(o=>{const ok=o.check();txt.push((ok?'✅ ':'❌ ')+o.label);d+=ok?6:-8});
 G.board.conf=clamp(G.board.conf+d,0,100);
 if(G.fin&&me().balance<0){G.board.conf=clamp(G.board.conf-8,0,100);txt.push('❌ Finances dans le rouge')}
 if(G.board.conf<=10)G.fired=true;
 G.phase='offseason';G.day=G.cal.length;
 // contrats IA
 for(const t of Object.values(G.teams)){if(t.id===G.me&&G.mode==='manager')continue;for(const p of roster(t.id).filter(p=>p.contractEnd<=G.season&&p.id!==G.pid)){
   if(rnd()<.75){p.wage=askWage(p,t);p.contractEnd=G.season+ri(1,3)}else{p.team=null;p.wage=0;p.contractEnd=0;p.listed=false}}}
 for(let i=0;i<12;i++){const p=genPlayer(ri(42,58),ri(16,19),pick(['SMG','AR','FLEX']));p.pot=ri(66,92);p.morale=60}
 for(let i=0;i<5;i++)genPlayer(ri(52,68),ri(21,28),pick(['SMG','AR','FLEX']));
 for(const p of freeAgents())if(p.age>=33)delete G.players[p.id];
 if(G.mode==='player')careerSeasonEnd(champ,pos);else msg(`Fin de saison ${G.season}`,`<b>Champion : ${champ?tname(champ):'—'}</b><br>Votre parcours : ${pos===1?'🏆 Champions !':pos===2?'Finale':pos===3?'Demi-finale':pos===5?'Quarts':'Non qualifié'} · ${q}ᵉ aux ${ED.pts.toLowerCase()}.<br>${txt.join('<br>')}<br>Confiance du board : ${Math.round(G.board.conf)}%.<br><br>C'est l'intersaison : renouvelez vos contrats expirants et attaquez le marché des agents libres !`);
 news(`🎖️ Saison ${G.season} terminée — ${champ?tname(champ):'?'} champion !`);
 save();
 setTimeout(()=>{refreshUI();G.mode==='player'?openSeasonEndP():openSeasonEnd()},0);
}
function startNextSeason(){
 const mine=G.mode==='player'?[]:roster(G.me).filter(p=>p.contractEnd<=G.season);
 if(G.mode==='player'&&P(G.pid).contractEnd<=G.season){toast('Signe une offre avant de lancer la saison.',1);return}
 if(G.mode==='manager'&&roster(G.me).length-mine.length<4){toast('Il vous faut au moins 4 joueurs sous contrat pour lancer la saison.',1);return}
 mine.forEach(p=>{news(`${p.tag} quitte votre équipe (fin de contrat).`);p.team=null;p.wage=0;p.contractEnd=0});
 for(const p of Object.values(G.players)){
  p.hist.push({s:G.season,m:p.st.m,k:p.st.k,d:p.st.d,r:p.st.m?+(p.st.rs/p.st.m).toFixed(2):0});p.st={m:0,k:0,d:0,rs:0,mvp:0};
  p.age++;const a=p.attrs;
  if(p.age>=26){const f=(p.age-25)/2;a.speed-=rnd()*2.2*f;a.aim-=rnd()*1.4*f;a.cons-=rnd()*.8*f;a.clutch+=rnd()*.8}
  else if(p.age<=23&&ovr(p)<p.pot){const g=(p.pot-ovr(p))/10*(p.id===G.pid?.35:1);ATTRS.forEach(k=>a[k]+=rnd()*2*g)}
  ATTRS.forEach(k=>a[k]=clamp(a[k]+(rnd()-.5)*1.6,28,97));
  if(p.age>=26)p.pot=Math.max(ovr(p),p.pot-1);
  p.fatigue=10;p.morale=p.team?clamp(p.morale,45,75):60;p.form=50;p.listed=false;
  if(p.age>=31&&p.id!==G.pid&&rnd()<Math.min(1,(p.age-30)*.28)){if(p.team===G.me)msg('Retraite',`${p.tag} (${p.age} ans) prend sa retraite après une belle carrière.`);delete G.players[p.id]}
 }
 for(const t of Object.values(G.teams)){if(t.id!==G.me||G.mode==='player')aiSign(t,6,true);t.chem=t.id===G.me?Math.max(35,t.chem-10):ri(52,70);autoLineup(t.id)}
 G.season++;G.phase='season';newSeasonSetup();setObjectives();
 me().lineup=me().lineup.filter(id=>P(id)&&P(id).team===G.me);if(me().lineup.length<4)autoLineup(G.me);
 msg(`Saison ${G.season} — c'est parti !`,`Nouveau calendrier, nouveaux objectifs. Vérifiez votre composition et votre entraînement.`);
 news(`🚀 Début de la saison ${G.season}`);
 if(G.mode==='player'){const c=G.car;c.offers=[];c.offersDone=false;c.snap={...P(G.pid).attrs};c.last={};autoLineup(G.me);if(P(G.pid).age>=36){A.close();endCareer();return}}
 maybeInterstitial();
 save();A.close();refreshUI();
}
function setObjectives(){
 if(G.mode==='player'){G.board.obj=[];return}
 const ex=expRank(G.me);
 G.board.obj=[];
 if(ex<=3)G.board.obj.push({label:'Finir top 2 du Championnat ou gagner un Major',check:()=>{const b=G.brk.champs||{};return(b[G.me]||9)<=2||[1,2,3,4].some(s=>(G.brk['major'+s]||{})[G.me]===1)}});
 else if(ex<=8)G.board.obj.push({label:'Se qualifier pour le Championnat (top 8 aux points)',check:()=>ptsRank().indexOf(G.me)<8});
 else G.board.obj.push({label:`Éviter la dernière place aux ${ED.pts.toLowerCase()}`,check:()=>ptsRank().indexOf(G.me)<11});
 G.board.obj.push({label:'Garder des finances positives',check:()=>me().balance>=0});
}

/* ---------- tick quotidien ---------- */
function trainPlayer(p,t,g){
 const age=p.age,ageF=age<=19?1.7:age<=21?1.4:age<=23?1:age<=25?.55:.25;
 const gap=clamp((p.pot-ovr(p))/8,0,1.6),coachF=.8+.1*t.staff.coach,fat=p.fatigue>75?.5:1,focus=p.focus||t.training.focus;
 for(const k of ATTRS){const w=focus==='bal'?1:focus===k?2.4:.55;
  p.attrs[k]=Math.min(97,p.attrs[k]+.035*ageF*gap*coachF*g*w*fat*(.5+rnd()))}}
function dailyTick(day){
 const inten={low:{f:-8,g:.6},normal:{f:-4,g:1},high:{f:2,g:1.45}};
 for(const t of Object.values(G.teams)){
  const iv=inten[t.training.intensity],lu=new Set(t.lineup),wins=t.form.filter(x=>x==='W').length;
  if(t.id!==G.me||G.mode==='player')t.training={focus:'bal',intensity:'normal'};
  for(const p of roster(t.id)){
   trainPlayer(p,t,inten[t.training.intensity].g);
   p.fatigue=clamp(p.fatigue+iv.f-t.staff.psy*.5-(lu.has(p.id)?0:3),0,100);
   let tg=62+(lu.has(p.id)?8:-6)+(wins-2.5)*3;
   if(p.wage<askWage(p,t)*.75)tg-=8;
   p.morale=clamp(p.morale+(tg-p.morale)*.1+t.staff.psy*.1,0,100);
   p.form=clamp(p.form+(50-p.form)*.08,5,95);
  }
  if(t.id!==G.me||G.mode==='player'){autoLineup(t.id);t.chem=Math.min(85,t.chem+.45);if(roster(t.id).length<5||rnd()<.03)aiSign(t,6,roster(t.id).length<5)}
  else{t.chem=Math.min(92,t.chem+.6)}
 }
 if(G.mode==='player'){careerTick(day);return}
 // finances du joueur
 const t=me(),inc=Math.round(10+t.rep*.22),stf=Object.values(t.staff).reduce((s,l)=>s+l*30,0)/DAYS,wg=Math.round(payroll(G.me)/DAYS+stf);
 t.balance+=inc-wg;G.fin.income+=inc;G.fin.wages+=wg;G.balHist.push({d:G.day+1,b:Math.round(t.balance)});
 userEvents();
}
function userEvents(){
 const t=me(),r=roster(G.me);
 // offres d'achat
 for(const p of r){
  const hot=ovr(p)>=70&&!p.listed&&rnd()<.012;
  if((p.listed&&rnd()<.16)||hot){
   const buyers=Object.values(G.teams).filter(x=>x.id!==G.me&&roster(x.id).length<MAXROSTER);
   if(!buyers.length)continue;
   const b=pick(buyers),fee=Math.round(valueP(p)*(hot?1.25+rnd()*.25:.8+rnd()*.35));
   msg(`Offre pour ${p.tag}`,`${tname(b.id)} propose <b>${fmtK(fee)}</b> pour ${p.tag} (${ovr(p)} OVR, contrat jusqu'en S${p.contractEnd}).`,[{l:'Accepter',fn:'sell',a:{pid:p.id,tid:b.id,fee}},{l:'Refuser',fn:'noop'}]);
  }
  if(p.morale<32&&rnd()<.08&&!(p.reqDay>=G.day-15)){
   p.reqDay=G.day;
   msg(`${p.tag} est mécontent`,`${p.tag} se plaint ${r.length>4&&!t.lineup.includes(p.id)?'de son temps de jeu':'de ses conditions'}. Il réclame une revalorisation de 15%.`,[{l:'Augmenter (+15%)',fn:'raise',a:{pid:p.id}},{l:'Refuser',fn:'snub',a:{pid:p.id}}]);
  }
 }
 if(rnd()<.07){const ev=ri(1,3);
  if(ev===1){const amt=ri(40,110);msg('Offre de sponsor',`Un sponsor propose <b>${fmtK(amt)}</b> pour une journée de contenu avec vos joueurs (fatigue +8 pour les titulaires).`,[{l:'Accepter',fn:'sponsor',a:{amt}},{l:'Décliner',fn:'noop'}])}
  else if(ev===2){const p=genPlayer(ri(46,58),ri(16,18),pick(['SMG','AR','FLEX']));p.pot=ri(78,94);p.morale=60;msg('Pépite détectée !',`Votre scout a repéré <b>${p.tag}</b> (${p.age} ans, ${p.role}), agent libre à fort potentiel. Rendez-vous sur le marché.`,[{l:'Voir le joueur',fn:'viewp',a:{pid:p.id}}])}
  else{t.rep=Math.min(99,t.rep+1);news('📈 Votre équipe fait le buzz sur les réseaux (+1 réputation).')}}
}
function aiSign(t,max,force){
 let guard=0;
 while(roster(t.id).length<max&&guard++<8){
  const r=roster(t.id),worst=Math.min(...r.map(ovr),99),room=CAP-payroll(t.id);
  const c=freeAgents().filter(p=>askWage(p,t)<=room).sort((a,b)=>worth(b)-worth(a))[0];
  if(!c)break;
  if(!force&&r.length>=5&&worth(c)<worst+1)break;
  c.team=t.id;c.wage=askWage(c,t);c.contractEnd=G.season+ri(1,3)-(G.phase==='season'?1:0);c.morale=65;
  if(G.phase==='season'&&worth(c)>55)news(`✍️ ${c.tag} signe chez ${t.short}.`);
 }}

 noop(){},

function evalOffer(p,fee,wage,years){
 const t=me(),sell=p.team?T(p.team):null,out=[];let st='ok',cf=fee,cw=wage;
 let req=0;if(sell){req=Math.round(valueP(p)*(.95+(roster(p.team).length<=4?.5:0))*(T(p.team).lineup.includes(p.id)?1.15:1))}
 const ask=Math.round(askWage(p,t)*(sell?1.08:1));
 if(sell){if(fee<req*.8){st='no';cf=req;out.push(`${sell.short} rejette l'offre (insuffisante).`)}else if(fee<req){st='counter';cf=req;out.push(`${sell.short} réclame ${fmtK(req)}.`)}}
 if(wage<ask*.85){st='no';cw=ask;out.push(`${p.tag} refuse : il vise environ ${fmtK(ask)}/an.`)}
 else if(wage<ask*.98){if(st==='ok')st='counter';cw=ask;out.push(`${p.tag} demande ${fmtK(ask)}/an.`)}
 if(st==='ok')out.push('Accord trouvé !');
 return{st,msg:out.join(' '),fee:cf,wage:cw}}
function canAfford(p,fee,wage,renew){
 if(!renew&&roster(G.me).length>=MAXROSTER)return'Effectif complet (6 max) : libérez ou vendez un joueur.';
 if(me().balance<fee)return`Budget insuffisant (${fmtK(me().balance)} disponibles).`;
 if(payroll(G.me)-(renew?p.wage:0)+wage>CAP)return`Plafond salarial dépassé (${fmtK(CAP)}).`;
 return null}
function signPlayer(p,fee,wage,years){
 const old=p.team,seller=old?T(old):null;
 me().balance-=fee;G.fin.transfers-=fee;if(fee)ledger(`Achat de ${p.tag}`,-fee);
 p.team=G.me;p.wage=wage;p.contractEnd=G.season+years-(G.phase==='season'?1:0);p.morale=72;p.listed=false;p.focus=null;
 if(old){autoLineup(old);if(roster(old).length<4)aiSign(seller,5,true)}
 if(roster(G.me).length<=4||me().lineup.length<4)autoLineup(G.me);
 me().chem=Math.max(30,me().chem-5);
 news(`✍️ ${T(G.me).short} signe ${p.tag}${fee?' pour '+fmtK(fee):' (agent libre)'}.`)}

 <div class="row" style="margin-top:10px"><button class="btn sm" onclick="A.autoLU()">✨ Composition auto</button><span class="mut">Rôles : ${['SMG','AR','FLEX'].map(x=>`${x} ×${lu.filter(p=>p.role===x).length}`).join(' · ')} · équilibre ${roleBalance(lu)>=1?'<b class="good">bon</b>':roleBalance(lu)>=0?'<b class="warn">correct</b>':'<b class="bad">déséquilibré</b>'}</span></div>`}

 ${['hp','snd','ovl'].map(m=>`<div style="margin:10px 0"><b>${MODE[m]}</b> <span class="mut">· force ${teamStrength(G.me,m,t.tactics[m]).S.toFixed(1)}</span><div class="row" style="margin-top:4px">${['agr','bal','cau'].map(x=>`<button class="btn sm ${t.tactics[m]===x?'pri':''}" onclick="A.tact('${m}','${x}')">${TACT[x]}</button>`).join('')}</div></div>`).join('')}`}

 <div class="grid g2"><div class="card"><h3>Quatre titulaires</h3>${lineupEditor()}</div><div class="card"><h3>Stratégie par mode</h3>${tacticEditor()}</div></div>
 <div class="grid g3" style="margin-top:14px">${['hp','snd','ovl'].map(m=>{const ps=lineupPlayers(G.me);return`<div class="card"><h3>${MODE[m]}</h3>${ps.map(p=>`<div class="row" style="justify-content:space-between;margin:3px 0"><span><b>${p.tag}</b> ${roleC(p.role)}</span><span>${ovrB(Math.round(effMode(p,m)))}</span></div>`).join('')}</div>`}).join('')}</div>

/* ---- Entraînement & Staff ---- */
VIEWS.train=()=>{

 const focusOpts=(cur,withDef)=>`${withDef?'<option value="">Équipe</option>':''}<option value="bal" ${cur==='bal'?'selected':''}>Équilibré</option>${ATTRS.map(k=>`<option value="${k}" ${cur===k?'selected':''}>${ATTR_L[k]}</option>`).join('')}`;

 <div class="grid g2"><div class="card"><h3>Programme d'équipe</h3><div class="kv"><span>Axe de travail</span><select class="sel" onchange="A.train('focus',this.value)">${focusOpts(t.training.focus)}</select>
 <span>Intensité</span><select class="sel" onchange="A.train('intensity',this.value)">${[['low','Légère (récupération)'],['normal','Normale'],['high','Intensive (fatigue)']].map(([k,l])=>`<option value="${k}" ${t.training.intensity===k?'selected':''}>${l}</option>`).join('')}</select></div>
 <p class="mut">Plus l'intensité est haute, plus les joueurs progressent vite — mais la fatigue s'accumule et pénalise les performances. Les jeunes à fort potentiel progressent bien plus vite que les vétérans.</p></div>
 <div class="card"><h3>Staff</h3>${Object.keys(STAFF_L).map(k=>{const l=t.staff[k];return`<div class="row" style="margin:7px 0"><div style="flex:1"><b>${STAFF_L[k]}</b><div class="mut" style="font-size:13px">${STAFF_D[k]}</div></div><div>${[1,2,3,4,5].map(i=>`<span class="pip ${i<=l?'on':''}"></span>`).join('')}</div>${l<5?`<button class="btn sm" onclick="A.upgrade('${k}')" ${t.balance<STAFF_COST[l+1]?'disabled':''}>↑ ${fmtK(STAFF_COST[l+1])}</button>`:'<span class="pill">MAX</span>'}</div>`}).join('')}
 <div class="mut" style="font-size:13px">Chaque niveau de staff coûte aussi 30k/an de salaire.</div></div></div>
 <div class="card" style="margin-top:14px"><h3>Programmes individuels</h3><div class="tw"><table><tr><th>Joueur</th><th>Âge</th><th>OVR</th><th>Pot.</th>${ATTRS.map(k=>`<th class="c">${ATTR_L[k]}</th>`).join('')}<th>Axe</th></tr>
 ${r.map(p=>`<tr><td class="clk" onclick="A.player('${p.id}')"><b>${p.tag}</b></td><td>${p.age}</td><td>${ovrB(ovr(p))}</td><td class="mut">${potRange(p)}</td>${ATTRS.map(k=>`<td class="c">${Math.round(p.attrs[k])}</td>`).join('')}<td><select class="sel" onchange="A.pfocus('${p.id}',this.value)">${focusOpts(p.focus||'',true)}</select></td></tr>`).join('')}</table></div></div>`}

/* ---- Marché ---- */
VIEWS.market=()=>{
 const f=G.sel.mkt,t=me();
 let list=f.tab==='fa'?freeAgents():Object.values(G.players).filter(p=>p.team&&p.team!==G.me);
 if(f.role)list=list.filter(p=>p.role===f.role);
 if(f.q)list=list.filter(p=>p.tag.toLowerCase().includes(f.q.toLowerCase()));
 list=list.filter(p=>ovr(p)>=f.minOvr&&p.age<=f.maxAge);
 list.sort((a,b)=>(f.sort==='pot'?b.pot-a.pot:ovr(b)-ovr(a)));
 const total=list.length;list=list.slice(0,60);
 const mine=roster(G.me).filter(p=>p.listed);
 const exp=roster(G.me).filter(p=>yearsLeft(p)<=1).sort((a,b)=>a.contractEnd-b.contractEnd);
 return`<div class="h1">Marché des transferts <small>budget ${fmtK(t.balance)} · marge salariale ${fmtK(CAP-payroll(G.me))} · effectif ${roster(G.me).length}/${MAXROSTER}</small></div>
 <div class="tabs">${[['fa','Agents libres'],['all','Joueurs sous contrat'],['mine','Mes contrats & ventes']].map(([k,l])=>`<button class="${f.tab===k?'on':''}" onclick="A.mkt('tab','${k}')">${l}</button>`).join('')}</div>
 ${f.tab==='mine'?`<div class="grid g2"><div class="card"><h3>Contrats expirant bientôt</h3>${exp.map(p=>`<div class="row" style="margin:5px 0"><b style="width:90px">${p.tag}</b>${ovrB(ovr(p))}<span class="${yearsLeft(p)<=0?'bad':'warn'}">${yearsLeft(p)<=0?'EXPIRÉ':'dernière année'} (S${p.contractEnd})</span><button class="btn sm" style="margin-left:auto" onclick="A.offer('${p.id}','renew')">Prolonger</button></div>`).join('')||'<span class="mut">Aucun contrat n\'expire prochainement.</span>'}</div>
 <div class="card"><h3>Joueurs sur la liste des transferts</h3>${mine.map(p=>`<div class="row" style="margin:5px 0"><b style="width:90px">${p.tag}</b>${ovrB(ovr(p))}<span class="mut">valeur ${fmtK(valueP(p))}</span><button class="btn sm" style="margin-left:auto" onclick="A.list('${p.id}')">Retirer</button></div>`).join('')||'<span class="mut">Aucun. Mettez un joueur « à vendre » depuis son profil : les clubs enverront des offres.</span>'}</div></div>`
 :`<div class="flt"><input placeholder="Rechercher un tag…" value="${esc(f.q)}" oninput="A.mkt('q',this.value,1)" style="min-width:160px">
 <select onchange="A.mkt('role',this.value)"><option value="">Tous rôles</option>${['SMG','AR','FLEX'].map(r=>`<option ${f.role===r?'selected':''}>${r}</option>`).join('')}</select>
 <label>OVR ≥ <input type="number" min="0" max="99" value="${f.minOvr}" style="width:70px" onchange="A.mkt('minOvr',+this.value)"></label>
 <label>Âge ≤ <input type="number" min="16" max="40" value="${f.maxAge}" style="width:70px" onchange="A.mkt('maxAge',+this.value)"></label>
 <select onchange="A.mkt('sort',this.value)"><option value="ovr">Tri : OVR</option><option value="pot" ${f.sort==='pot'?'selected':''}>Tri : potentiel</option></select><span class="mut">${total} résultats (60 max affichés)</span></div>
 <div class="card"><div class="tw"><table><tr><th>Joueur</th><th>Club</th><th>Rôle</th><th>Âge</th><th>OVR</th><th>Pot.</th><th>Salaire</th><th>Valeur</th><th></th></tr>
 ${list.map(p=>`<tr class="clk" onclick="A.player('${p.id}')"><td><b>${p.tag}</b> ${FLAG[p.nat]}</td><td>${p.team?bdg(p.team):'<span class="pill">Libre</span>'}</td><td>${roleC(p.role)}</td><td>${p.age}</td><td>${ovrB(ovr(p))}</td><td class="mut">${potRange(p)}</td><td>${p.team?fmtK(p.wage):'<span class="mut">≈'+fmtK(askWage(p,t))+'</span>'}</td><td>${p.team?fmtK(valueP(p)):'—'}</td><td class="rt"><button class="btn sm" onclick="event.stopPropagation();A.offer('${p.id}','buy')">Offre</button></td></tr>`).join('')}</table></div></div>`}`}

/* ---- Calendrier ---- */
VIEWS.cal=()=>{
 const out=G.cal.map((d,i)=>{
  const ms=d.matches,done=i<G.day||G.phase==='offseason',cur=i===G.day&&G.phase==='season';
  const um=ms.find(m=>m.a===G.me||m.b===G.me);
  let sum=`<b style="width:230px">${d.label}</b>`;
  if(um){const r=G.results[um.id],o=um.a===G.me?um.b:um.a;
   sum+=r?`<span>${bdg(um.a)} <b>${r.sa}–${r.sb}</b> ${bdg(um.b)}</span><b class="${(r.sa>r.sb)===(um.a===G.me)?'good':'bad'}">${(r.sa>r.sb)===(um.a===G.me)?'VICTOIRE':'DÉFAITE'}</b>`:`<span>vs ${bdg(o)} ${T(o).name}</span>`}
  else sum+=ms.length?'<span class="mut">pas de match</span>':'<span class="mut">à déterminer</span>';
  if(cur)sum+='<span class="pill acc">aujourd\'hui</span>';
  return`<details class="day" ${cur?'open':''}><summary>${sum}</summary><div class="in">${ms.map(m=>{const r=G.results[m.id];return`<div class="row ${m.a===G.me||m.b===G.me?'acc':''}" style="padding:3px 0">${bdg(m.a)} ${r?`<b>${r.sa}–${r.sb}</b>`:'vs'} ${bdg(m.b)} <span class="mut">${T(m.a).name} / ${T(m.b).name}</span>${r?`<button class="btn sm" style="margin-left:auto" onclick="A.report('${m.id}')">Rapport</button>`:''}</div>`}).join('')||'<span class="mut">Les affiches seront connues à l\'issue des journées précédentes.</span>'}</div></details>`}).join('');
 return`<div class="h1">Calendrier & résultats <small>4 Stages · 4 Majors · Championnat</small></div>${out}`}

/* ---- Classements ---- */
function bracketHTML(kind,stage){
 const days=G.cal.filter(d=>d.k===kind&&(kind==='champs'||d.stage===stage));
 return`<div class="brk">${days.map(d=>`<div><div class="mut" style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px">${RD[d.rd]}</div>${d.matches.length?d.matches.map(m=>{const r=G.results[m.id];return`<div class="bm" ${r?`style="cursor:pointer" onclick="A.report('${m.id}')"`:''}><div class="${r&&r.sa>r.sb?'w':''}"><span>${bdg(m.a)} ${T(m.a).name}</span><b>${r?r.sa:''}</b></div><div class="${r&&r.sb>r.sa?'w':''}"><span>${bdg(m.b)} ${T(m.b).name}</span><b>${r?r.sb:''}</b></div></div>`}).join(''):'<div class="mut">À venir…</div>'}</div>`).join('')}</div>`}

 const dayNow=G.phase==='season'?G.cal[G.day]:null;if(dayNow)prepareDay(dayNow);
 return`<div class="h1">Classements</div>
 <div class="tabs">${[1,2,3,4].map(i=>`<button class="${s===i?'on':''}" onclick="A.stage(${i})">Stage ${i}</button>`).join('')}</div>
 <div class="grid g2"><div class="card"><h3>Stage ${s} <span class="r mut">top 8 → Major</span></h3><div class="tw"><table><tr><th>#</th><th>Équipe</th><th class="c">V</th><th class="c">D</th><th class="c">Cartes</th><th class="c">Diff</th><th class="c">Forme</th></tr>${rk.map((t,i)=>`<tr class="${t===G.me?'me':''} ${i<8?'q':''}"><td>${i+1}</td><td>${bdg(t)} ${tname(t)}</td><td class="c">${tb[t].w}</td><td class="c">${tb[t].l}</td><td class="c">${tb[t].mw}-${tb[t].ml}</td><td class="c">${tb[t].mw-tb[t].ml>0?'+':''}${tb[t].mw-tb[t].ml}</td><td class="c">${formH(t)}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>${ED.pts} — saison ${G.season} <span class="r mut">top 8 → Championnat</span></h3><div class="tw"><table><tr><th>#</th><th>Équipe</th><th class="c">Points</th><th class="c">V-D</th><th class="c">Titres</th></tr>${pr.map((t,i)=>`<tr class="${t===G.me?'me':''} ${i<8?'q':''}"><td>${i+1}</td><td>${bdg(t)} ${tname(t)}</td><td class="c"><b>${G.pts[t]}</b></td><td class="c">${G.rec[t].w}-${G.rec[t].l}</td><td class="c">${T(t).titles?'🏆'.repeat(Math.min(T(t).titles,5)):'—'}${T(t).majors?` <span class="mut">${T(t).majors}M</span>`:''}</td></tr>`).join('')}</table></div></div></div>
 <div class="card" style="margin-top:14px"><h3>Bracket — Major ${s}</h3>${bracketHTML('major',s)}</div>
 <div class="card" style="margin-top:14px"><h3>Bracket — Championnat</h3>${bracketHTML('champs')}</div>`}

 <div class="kv" style="margin-top:10px"><span>${ED.titres}</span><b>${t.titles}</b><span>Majors</span><b>${t.majors}</b><span>Chimie</span><b>${Math.round(t.chem)}%</b></div></div></div>

 if(f.role)l=l.filter(p=>p.role===f.role);

/* ---- Finances ---- */
VIEWS.fin=()=>{
 const t=me(),h=G.balHist,mx=Math.max(...h.map(x=>x.b),1),mn=Math.min(...h.map(x=>x.b),0),W=600,H=70;
 const pts=h.map((x,i)=>`${(i/Math.max(1,h.length-1))*W},${H-((x.b-mn)/(mx-mn||1))*(H-6)-3}`).join(' ');

 return`<div class="h1">Finances</div><div class="grid g4">

 <div class="card"><h3>Revenus (saison)</h3><b style="font-size:26px">${fmtK(G.fin.income+G.fin.prizes)}</b><div class="mut">dont primes ${fmtK(G.fin.prizes)}</div></div>
 <div class="card"><h3>Salaires (saison)</h3><b style="font-size:26px">${fmtK(G.fin.wages)}</b></div>

 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Évolution du budget</h3><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--team)" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${pts}"/></svg>
 <div class="kv" style="margin-top:8px"><span>Revenus sponsors / jour</span><b>${fmtK(Math.round(10+t.rep*.22))}</b><span>Masse salariale annuelle</span><b>${fmtK(payroll(G.me))}</b><span>Staff annuel</span><b>${fmtK(stf)}</b><span>Réputation</span><b>${t.rep}</b></div></div>
 <div class="card"><h3>Mouvements récents</h3><ul class="ledger">${G.ledger.slice(0,12).map(l=>`<li class="row"><span>${l.t}</span><b class="${l.v<0?'bad':'good'}" style="margin-left:auto">${l.v>0?'+':''}${fmtK(l.v)}</b></li>`).join('')||'<li class="mut">Aucun mouvement.</li>'}</ul></div></div>`}

function radar(p,size){
 const c=size/2,r=size/2-30,pt=(i,v)=>{const a=-Math.PI/2+i*Math.PI/3;return[c+Math.cos(a)*r*v,c+Math.sin(a)*r*v]};
 const ring=v=>ATTRS.map((k,i)=>pt(i,v).join(',')).join(' ');
 return`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="max-width:100%"><g fill="none" stroke="#243040">${[.25,.5,.75,1].map(v=>`<polygon points="${ring(v)}"/>`).join('')}${ATTRS.map((k,i)=>`<line x1="${c}" y1="${c}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}"/>`).join('')}</g>
 <polygon points="${ATTRS.map((k,i)=>pt(i,p.attrs[k]/100).join(',')).join(' ')}" fill="color-mix(in srgb,var(--team) 30%,transparent)" stroke="var(--team)" stroke-width="2"/>
 ${ATTRS.map((k,i)=>{const[x,y]=pt(i,1.2);return`<text x="${x}" y="${y}" fill="#8896a8" font-size="11" text-anchor="middle" dominant-baseline="middle" font-family="Rajdhani">${ATTR_L[k]}</text>`}).join('')}</svg>`}

function reportHTML(res,noHead){
 const a=res.a,b=res.b,wA=res.sa>res.sb;
 const names=t=>t===a?a:b;
 const rows=tid=>{const ids=[...new Set(res.maps.flatMap(m=>Object.keys(m.stats)))].filter(id=>res.side&&res.side[id]===tid);
  return ids.map(id=>{const pl=P(id),tag=pl?pl.tag:res.tags[id],st=res.maps.map(m=>m.stats[id]);const k=st.reduce((s,x)=>s+(x?x.k:0),0),d=st.reduce((s,x)=>s+(x?x.d:0),0),r=avg(st.filter(Boolean).map(x=>x.r));
   return`<tr><td>${id===res.mvp?'⭐ ':''}${G.mode==='player'&&id===G.pid?'<b style="color:#ffd24a">★ '+tag+'</b>':'<b>'+tag+'</b>'}</td>${res.maps.map(m=>`<td class="c mut">${m.stats[id]?m.stats[id].k+'/'+m.stats[id].d:'—'}</td>`).join('')}<td class="c">${k}/${d}</td><td class="c"><b class="${r>=1.1?'good':r<.9?'bad':''}">${r.toFixed(2)}</b></td></tr>`}).join('')};
 return`${noHead?'':`<div class="scoreb"><div>${bdg(a,1)}<div class="n">${tname(a)}</div></div><div class="s">${res.sa} – ${res.sb}</div><div>${bdg(b,1)}<div class="n">${tname(b)}</div></div></div>`}
 <div class="tw" style="margin-top:10px"><table><tr><th>Carte</th>${res.maps.map((m,i)=>`<th class="c">${i+1}. ${MODE_S[m.mode]}</th>`).join('')}</tr><tr><td>${T(a).short}</td>${res.maps.map(m=>`<td class="c ${m.sa>m.sb?'good':''}"><b>${m.sa}</b></td>`).join('')}</tr><tr><td>${T(b).short}</td>${res.maps.map(m=>`<td class="c ${m.sb>m.sa?'good':''}"><b>${m.sb}</b></td>`).join('')}</tr></table></div>
 <div class="grid g2" style="margin-top:12px">${[a,b].map(t=>`<div class="tw"><table><tr><th>${T(t).short}</th>${res.maps.map((m,i)=>`<th class="c">K/D ${i+1}</th>`).join('')}<th class="c">Tot.</th><th class="c">Rating</th></tr>${rows(t)}</table></div>`).join('')}</div>
 <div style="margin-top:10px">MVP du match : <b class="acc">${res.tags&&res.tags[res.mvp]||'—'}</b></div>`}

let VW=null;

function openViewer(res,live){
 const ev=[];res.maps.forEach((mp,i)=>{ev.push({t:'start',i});(mp.log||[]).forEach(l=>ev.push({t:'log',i,l}));ev.push({t:'end',i})});
 clearInterval(ui.timer);
 VW={res,live,ev,idx:0,wa:0,wb:0,spd:2,paused:false,done:false};
 A.locked=live;ui.fn=null;
 const el=$('#modal');el.className='mb on';
 el.innerHTML=`<div class="md"><div class="mh"><h2>${live?'Match en direct':'Replay du match'}</h2><span class="mut">${res.comp}</span>${live?'':'<button class="btn x" onclick="A.close()">✕</button>'}</div>
 <div class="scoreb"><div>${bdg(res.a,1)}<div class="n">${tname(res.a)}</div></div><div><div class="s" id="vm">0 – 0</div><div class="mut" id="vmode">Coup d'envoi</div><div class="s sm" id="vs">0 – 0</div></div><div>${bdg(res.b,1)}<div class="n">${tname(res.b)}</div></div></div>
 <div class="chips" style="justify-content:center;margin:8px 0" id="vtrack">${res.maps.map((m,i)=>`<span class="pill" id="vt${i}">${i+1} · ${MODE_S[m.mode]}</span>`).join('')}</div>
 <div class="row" style="margin:8px 0"><button class="btn sm" id="vpb" onclick="A.vPause()">⏸ Pause</button>${[1,2,4,8].map(s=>`<button class="btn sm vsp" data-s="${s}" onclick="A.vSpeed(${s})">×${s}</button>`).join('')}<button class="btn sm warn" onclick="A.vSkip()">⏭ Passer</button><button class="btn pri" id="vcont" style="display:none;margin-left:auto" onclick="A.afterMatch()">Continuer ▶</button></div>
 <div class="log" id="vlog" style="height:280px"></div><div id="vend"></div></div>`;
 vSync();VW.timer=ui.timer=setInterval(vStep,VSPD[VW.spd]);
 if(window.Music)Music.set('match')}
function vSync(){document.querySelectorAll('.vsp').forEach(b=>b.classList.toggle('pri',+b.dataset.s===VW.spd));const pb=$('#vpb');if(pb)pb.textContent=VW.paused?'▶ Reprendre':'⏸ Pause'}
function vAdd(h){const L=$('#vlog');if(!L)return;L.insertAdjacentHTML('beforeend',`<div>${h}</div>`);L.scrollTop=L.scrollHeight}
function vStep(){
 const w=VW;if(!w||w.paused||w.done)return;
 const e=w.ev[w.idx++],res=w.res;
 if(!e){vFinish();return}
 if(e.t==='start'){const mp=res.maps[e.i];vAdd(`<b>— Carte ${e.i+1} : ${MODE[mp.mode]} · ${mp.map}</b>`);$('#vmode').textContent=`Carte ${e.i+1} · ${MODE[mp.mode]}`;$('#vs').textContent='0 – 0';const t=$('#vt'+e.i);if(t)t.classList.add('on')}
 else if(e.t==='log'){vAdd(`${e.l.text} <span class="mut">[${e.l.sa}–${e.l.sb}]</span>`);$('#vs').textContent=`${e.l.sa} – ${e.l.sb}`;if(window.SFX)SFX.tick()}
 else{const mp=res.maps[e.i],aw=mp.sa>mp.sb;aw?w.wa++:w.wb++;$('#vm').textContent=`${w.wa} – ${w.wb}`;vAdd(`<b class="acc">Carte ${e.i+1} remportée par ${T(aw?res.a:res.b).short} (${mp.sa}–${mp.sb})</b>`);
  const t=$('#vt'+e.i);if(t){t.classList.remove('on');t.classList.add(((aw)===(res.a===G.me))?'good':'bad');t.textContent=`${e.i+1} · ${MODE_S[mp.mode]} ${mp.sa}–${mp.sb}`}
  if(window.SFX)(aw===(res.a===G.me))?SFX.good():SFX.bad()}}
function vFinish(){
 const w=VW;if(!w||w.done)return;w.done=true;clearInterval(ui.timer);
 const res=w.res;$('#vm').textContent=`${res.sa} – ${res.sb}`;$('#vmode').textContent='Terminé';
 $('#vend').innerHTML=`<div style="margin-top:12px">${reportHTML(res,1)}</div>${perfCard(res)}`;
 const c=$('#vcont');if(c)c.style.display=w.live?'':'none';
 const won=(res.sa>res.sb)===(res.a===G.me);if(window.SFX)won?SFX.win():SFX.lose();if(window.Music)Music.set('game')}

 const fk=hasT('marathon')?.8:1;
 if(fx.fat)p.fatigue=clamp(p.fatigue+(fx.fat>0?fx.fat*k*fk:fx.fat),0,100);
 c.stress=clamp(c.stress+(fx.stress||0)*(fx.stress>0?k*stressK():1)-1.8,0,100);

 // relations

 mates.forEach(x=>{let r=c.rel[x.id];if(r===undefined)r=c.rel[x.id]=50;r+=(fx.rel||0)*relK()/1.5+(50-r)*.01;
  if(!T(G.me).lineup.includes(p.id)&&T(G.me).lineup.includes(x.id)&&ovr(x)<ovr(p)-2)r-=.15;c.rel[x.id]=clamp(r,0,100)});

 if(ar<50)t.chem=Math.min(t.chem,85-(50-ar)*.4);
 // finances

 c.cash+=wd+sp-ag-liv;

 if(day&&G.day%3===0)c.fanHist.push(c.fans);if(c.fanHist.length>40)c.fanHist.shift();

 checkAch();

function careerOffers(){

function ensureCar(){const c=G.car;if(!c)return;c.arcs=c.arcs||{};c.flags=c.flags||{};c.npc=c.npc||{rival:50,agent:50,mentor:50,family:50};c.flow=c.flow||[];c.decider=c.decider||'calm';if(c.extra===undefined)c.extra=null}
function arcTick(){
 const c=G.car;ensureCar();if(c.pending||G.phase!=='season'||G.day>=G.cal.length-1)return;
 for(const id in c.arcs){const a=c.arcs[id];if(!a.done&&a.due<=G.day){c.pending={id:'arc',arc:id,node:a.n};c.lastEv=G.day;return}}
 if(G.day-c.lastEv<4)return;
 if(Object.values(c.arcs).filter(a=>!a.done).length>=2)return;
 const cand=Object.keys(ARCS).filter(id=>!c.arcs[id]&&G.day>=ARCS[id].min&&(()=>{try{return ARCS[id].cond()}catch(e){return false}})());
 if(cand.length&&rnd()<.2){const id=pick(cand);if(ARCS[id].setup)ARCS[id].setup();c.arcs[id]={n:'start',due:G.day,done:false,path:[],picks:{}};c.pending={id:'arc',arc:id,node:'start'};c.lastEv=G.day}}
function arcEvent(pd){
 const A_=ARCS[pd.arc],c=G.car,node=A_.nodes[pd.node],arc=c.arcs[pd.arc];
 return{make:()=>({ic:A_.ic,t:`${A_.n} — ${node.t}`,x:node.x(),arc:1,ch:node.ch.map((ch,i)=>{
  const locked=ch.req&&!ch.req(),dis=locked||(ch.dis&&ch.dis());
  const pct=ch.roll?` · 🎲 ${Math.round(rollP(ch.roll)*100)}% (${STAT_L[ch.roll.stat]})`:'';
  return{l:ch.l+(locked?` 🔒`:''),s:(locked?ch.lock:(ch.s||''))+pct,dis,run(){
   let br=ch,txt=ch.txt||'',okf=null;
   if(ch.roll){okf=rnd()<rollP(ch.roll);br=okf?ch.ok:ch.ko;txt=(okf?'✅ Réussite. ':'❌ Échec. ')+(br.txt||'')}
   if(br.fx)br.fx();
   c.flow.unshift({arc:pd.arc,node:pd.node,pick:i,ok:okf,day:G.day,season:G.season});if(c.flow.length>120)c.flow.pop();
   arc.path.push(pd.node);arc.picks[pd.node]=i;
   const nx=br.next;let res=txt;
   if(nx){const nn=A_.nodes[nx];
    if(nn.end){arc.path.push(nx);arc.done=true;arc.end=nx;if(nn.fx)nn.fx();clog(nn.ic||'🔀',`${A_.n} : ${nn.t}.`);res+=`<div class="endcard"><b>${nn.ic||''} ${nn.t}</b><div>${nn.x()}</div></div>`}
    else{arc.n=nx;arc.due=G.day+(br.delay||ch.delay||ri(4,8))}}
   else{arc.done=true}
   c.pending=null;return res}}})})}}
const evDef=pd=>pd.id==='arc'?arcEvent(pd):EVT[pd.id];

/* ---------- arbre des choix (flowchart) ---------- */
function flowArc(id){
 const A_=ARCS[id],c=G.car,arc=c.arcs[id],nodes=A_.nodes;
 const kids=n=>{const o=[];(nodes[n].ch||[]).forEach(ch=>{[ch.next,ch.ok&&ch.ok.next,ch.ko&&ch.ko.next].forEach(x=>{if(x&&!o.includes(x))o.push(x)})});return o};
 const depth={start:0},q=['start'];while(q.length){const n=q.shift();kids(n).forEach(k=>{if(depth[k]===undefined){depth[k]=depth[n]+1;q.push(k)}})}
 const cols={};Object.keys(depth).forEach(n=>(cols[depth[n]]=cols[depth[n]]||[]).push(n));
 const W=150,H=44,GX=46,GY=12,pos={};let maxRows=0;
 Object.keys(cols).forEach(d=>{cols[d].forEach((n,i)=>{pos[n]={x:d*(W+GX),y:i*(H+GY)}});maxRows=Math.max(maxRows,cols[d].length)});
 const visited=n=>arc&&arc.path.includes(n);
 const seq=arc?arc.path:[];
 const chosen=new Set();for(let i=0;i<seq.length-1;i++)chosen.add(seq[i]+'>'+seq[i+1]);
 const seen=new Set(arc?arc.path:[]);const frontier=new Set();seq.forEach(n=>kids(n).forEach(k=>{if(!seen.has(k))frontier.add(k)}));
 const cur=arc&&!arc.done?arc.n:null;
 let edges='',boxes='';
 Object.keys(depth).forEach(n=>kids(n).forEach(k=>{const a=pos[n],b=pos[k],x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,ch=chosen.has(n+'>'+k),mx=(x1+x2)/2;
  edges+=`<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="${ch?'var(--team)':'#2b3646'}" stroke-width="${ch?3:1.5}" ${ch?'':'stroke-dasharray="4 4"'}/>`}));
 Object.keys(depth).forEach(n=>{const p=pos[n],nd=nodes[n],v=visited(n),isCur=n===cur,known=v||frontier.has(n),cls=v?'v':isCur?'c':known?'f':'u';
  boxes+=`<div class="fn ${cls} ${nd.end?'end':''}" style="left:${p.x}px;top:${p.y}px;width:${W}px;height:${H}px" title="${v?nd.t.replace(/"/g,''):'Branche non explorée'}"><span>${v?(nd.ic||(nd.end?'🏁':'●')):isCur?'⏳':known?'?':'🔒'}</span><b>${v?nd.t:isCur?'Prochaine étape':known?'Branche possible':'???'}</b></div>`});
 const w=(Math.max(...Object.keys(cols).map(Number))+1)*(W+GX),h=maxRows*(H+GY);
 const st=!arc?'<span class="pill">Non rencontré</span>':arc.done?`<span class="pill good">Terminé : ${nodes[arc.end].t}</span>`:'<span class="pill warn">En cours</span>';
 return`<div class="card" style="margin-bottom:12px"><h3>${A_.ic} ${A_.n}<span class="r">${st}</span></h3><div class="flowwrap"><div class="flow" style="width:${w}px;height:${h}px"><svg width="${w}" height="${h}">${edges}</svg>${boxes}</div></div></div>`}
VIEWS.pflow=()=>{ensureCar();const c=G.car,done=Object.values(c.arcs).filter(a=>a.done).length;
 return`<div class="h1">Arbre des choix <small>${done}/${Object.keys(ARCS).length} histoires terminées · ${c.flow.length} décisions</small></div>
 <p class="mut" style="margin:0 0 12px">Chaque histoire se ramifie selon tes décisions et tes stats. Les branches non explorées restent grisées : certaines ne reviendront peut-être jamais.</p>
 ${Object.keys(ARCS).map(flowArc).join('')}
 <div class="card"><h3>Dernières décisions</h3><ul class="ledger">${c.flow.slice(0,12).map(f=>{const nd=ARCS[f.arc].nodes[f.node],ch=nd.ch[f.pick];return`<li class="row"><span>${ARCS[f.arc].ic}</span><span><b>${nd.t}</b> — ${ch.l}${f.ok===true?' <span class="good">✅</span>':f.ok===false?' <span class="bad">❌</span>':''}</span><span class="mut" style="margin-left:auto;font-size:12px">S${f.season}</span></li>`}).join('')||'<li class="mut">Aucune décision pour l\'instant.</li>'}</ul></div>`};

async function verifyKey(key){
